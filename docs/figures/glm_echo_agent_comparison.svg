<text x="1230" y="77" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#172b3d" text-anchor="start">ECHO prefetch</text>
<text x="58" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#172b3d" text-anchor="start">32-query prefill window</text>
<text x="537" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#172b3d" text-anchor="start">Time per output token</text>
<text x="1016" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#172b3d" text-anchor="start">Mean request throughput</text>
