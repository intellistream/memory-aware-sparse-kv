<text x="1016" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#d46b35" text-anchor="start">-18.0% lower with prefetch</text>
<text x="1016" y="675" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#516476" text-anchor="start">Descriptive metric; no preregistered CI</text>
<text x="58" y="786" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b3d" text-anchor="start">Banking meets the ≥20 stable-episode gate; retail does not (17 stable episodes).</text>
<text x="58" y="819" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516476" text-anchor="start">Prefill window = adapter work for 32 post-event queries, not full prefill latency.</text>
<text x="58" y="843" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516476" text-anchor="start">Prototype retains an NPU KV shadow and does not overlap prefetch with compute; no HBM-saving claim.</text>
