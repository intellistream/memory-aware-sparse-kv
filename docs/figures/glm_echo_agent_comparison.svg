<text x="58" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#172b3d" text-anchor="start">BANKING · CONTROLLED · 21 episodes</text>
<text x="58" y="286" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516476" text-anchor="start">No prefetch</text>
<rect x="184" y="269" width="163.48" height="22" rx="4" fill="#346891"/>
<text x="355.48359014944447" y="286" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#172b3d" text-anchor="start">4.42 s</text>
