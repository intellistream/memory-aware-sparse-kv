<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="890" viewBox="0 0 1500 890" role="img" aria-labelledby="title description">
<title id="title">GLM agent prompt prefetch comparison</title>
<desc id="description">Paired offload modes across banking and retail agent prompts. Only the banking subset meets the controlled comparison gate.</desc>
<rect width="1500" height="890" fill="#ffffff"/>
<text x="58" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#172b3d" text-anchor="start">GLM agent prompts: cost of ECHO-style prefetch</text>
<text x="58" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#516476" text-anchor="start">Same KV movement in both offload modes · 48 event episodes × 3 repeats · single 910B2</text>
<rect x="1020" y="63" width="17" height="17" rx="3" fill="#346891"/>
<text x="1045" y="77" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#172b3d" text-anchor="start">No prefetch</text>
