<text x="537" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#d46b35" text-anchor="start">+20.2% longer with prefetch</text>
<text x="537" y="675" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#516476" text-anchor="start">Paired Δ +35.4 ms · 98.75% CI [29.1, 40.7] ms</text>
